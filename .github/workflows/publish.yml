name: Publish crates

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify release version
        id: version
        shell: bash
        run: |
          macro_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "axtra_macros") | .version')
          axtra_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "axtra") | .version')
          if [[ "$macro_version" != "$axtra_version" ]]; then
            echo "axtra and axtra_macros versions differ" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "axtra-v${axtra_version}" ]]; then
            echo "release tag must be axtra-v${axtra_version}" >&2
            exit 1
          fi
          echo "version=${axtra_version}" >> "$GITHUB_OUTPUT"

      - run: cargo test --workspace --all-features --locked

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish workspace crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate_exists() {
            curl --fail --silent --show-error "https://crates.io/api/v1/crates/$1/$RELEASE_VERSION" > /dev/null
          }

          if ! crate_exists axtra_macros; then
            cargo publish --locked -p axtra_macros
          fi

          for attempt in {1..30}; do
            if crate_exists axtra_macros; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "axtra_macros did not become available on crates.io" >&2
              exit 1
            fi
            sleep 10
          done

          if ! crate_exists axtra; then
            cargo publish --locked -p axtra
          fi
